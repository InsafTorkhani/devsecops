# Runs on every "git commit". A failing hook blocks the commit (shift-left).
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-ll", "-ii"]
        exclude: ^tests/
