stages:
  - build
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

build:
  stage: build
  image: python:3.12-slim
  script:
    - python --version
    - pip install --no-cache-dir -r requirements.txt

  artifacts:
    paths:
      - .

unit_tests:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --no-cache-dir -r requirements.txt
    - pytest -q
